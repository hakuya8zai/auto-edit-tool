<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<title>block-sorter</title>
<style>
  /* ---- Design tokens (Linear-inspired, monochrome with one accent) ---- */
  :root {
    --canvas:        #f9f9fb;
    --surface-1:     #ffffff;
    --surface-2:     #f4f4f6;
    --surface-3:     #edeef1;
    --hairline:      #e3e4e8;
    --hairline-strong:#cdced3;

    --ink:           #1f2024;
    --ink-muted:     #4a4c54;
    --ink-subtle:    #8a8f98;
    --ink-tertiary:  #b1b5bd;

    --accent:        #5e6ad2;
    --accent-hover:  #828fff;
    --accent-pressed:#5e69d1;
    --accent-soft:   #eef0fb;
    --warn:          #b3580d;
    --warn-soft:     #fef3e8;

    --r-sm: 6px;
    --r-md: 8px;
    --r-lg: 10px;
    --r-pill: 9999px;

    --s-1: 4px;
    --s-2: 8px;
    --s-3: 12px;
    --s-4: 16px;
    --s-5: 24px;
    --s-6: 32px;

    --shadow-1: 0 1px 2px rgba(15, 16, 17, 0.04), 0 0 0 1px rgba(15, 16, 17, 0.02);
    --shadow-2: 0 4px 14px rgba(15, 16, 17, 0.10), 0 0 0 1px rgba(15, 16, 17, 0.04);

    --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI",
            "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
    background: transparent;
    padding: 4px 0 12px;
    letter-spacing: -0.005em;
  }

  /* ---- Catcher (sticky drop zone for auto-route) ---- */
  #catcher {
    height: 36px;
    display: flex; align-items: center; justify-content: center;
    border: 1px dashed var(--hairline-strong);
    border-radius: var(--r-md);
    background: var(--surface-2);
    color: var(--ink-subtle);
    font-size: 12px;
    letter-spacing: 0.01em;
    margin: 0 0 var(--s-4);
    position: sticky;
    top: 0;
    z-index: 10;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
  }
  #catcher.hot {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  #catcher .item { display: none; }

  /* ---- Containers ---- */
  .container {
    background: var(--surface-1);
    border: 1px solid var(--hairline);
    border-radius: var(--r-lg);
    padding: var(--s-3);
    margin-bottom: var(--s-3);
  }
  .container.assembly {
    border: 1px solid var(--accent);
    background: linear-gradient(180deg, rgba(94,106,210,0.04), transparent 24px), var(--surface-1);
  }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: var(--s-2);
    padding: 0 var(--s-1);
    color: var(--ink);
  }
  .header .title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .header .meta {
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-subtle);
    font-variant-numeric: tabular-nums;
  }

  /* ---- Items area ---- */
  .items {
    min-height: 40px;
    border-radius: var(--r-md);
    padding: var(--s-1);
    transition: background 0.1s;
  }
  .items.empty {
    background: var(--surface-2);
  }
  .items.horizontal { display: flex; flex-direction: column; gap: var(--s-2); }
  .items.vertical   { display: flex; flex-direction: column; gap: var(--s-2); }

  /* ---- Layout: category row scrolls horizontally ---- */
  .row {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    gap: var(--s-3);
    margin-bottom: var(--s-4);
    overflow-x: auto;
    overflow-y: visible;
    padding-bottom: var(--s-2);
    scrollbar-width: thin;
  }
  .row::-webkit-scrollbar { height: 8px; }
  .row::-webkit-scrollbar-thumb {
    background: var(--hairline-strong);
    border-radius: var(--r-pill);
  }
  .row .container {
    margin-bottom: 0;
    flex: 0 0 220px;
    min-width: 220px;
    max-width: 220px;
  }

  /* ---- The card itself ---- */
  .item {
    position: relative;
    background: var(--surface-1);
    border: 1px solid var(--hairline);
    border-radius: var(--r-md);
    padding: var(--s-2) var(--s-3);
    cursor: grab;
    user-select: none;
    transition: border-color 0.1s, box-shadow 0.1s, transform 0.1s;
    box-shadow: var(--shadow-1);
  }
  .container.assembly .item {
    background: var(--surface-1);
  }
  .item:hover {
    border-color: var(--hairline-strong);
    box-shadow: var(--shadow-2);
  }
  .item:active { cursor: grabbing; }
  .item.ghost { opacity: 0.35; background: var(--accent-soft); }
  .item.drag {
    cursor: grabbing;
    box-shadow: 0 12px 32px rgba(15, 16, 17, 0.18);
    transform: rotate(0.5deg);
  }

  /* ---- Card summary row (always visible) ---- */
  .item .summary {
    display: flex;
    align-items: center;
    gap: var(--s-2);
    min-width: 0;
  }
  .item .role-dot {
    width: 18px; height: 18px;
    border-radius: var(--r-sm);
    background: var(--surface-2);
    display: inline-flex;
    align-items: center; justify-content: center;
    font-size: 11px;
    line-height: 1;
    flex: 0 0 18px;
  }
  .item .idx {
    display: none;
    font-size: 10px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 2px 6px;
    border-radius: var(--r-pill);
    font-variant-numeric: tabular-nums;
    flex: 0 0 auto;
  }
  .container.assembly .item .idx { display: inline-flex; }
  .item .name {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: -0.01em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1 1 auto;
    min-width: 0;
  }
  .item .secs {
    font-size: 11px;
    color: var(--ink-subtle);
    font-variant-numeric: tabular-nums;
    flex: 0 0 auto;
  }
  .item .expand-btn {
    border: 0;
    background: transparent;
    color: var(--ink-tertiary);
    cursor: pointer;
    padding: 2px 4px;
    margin: -2px -4px;
    border-radius: var(--r-sm);
    font-size: 10px;
    line-height: 1;
    transition: color 0.1s, background 0.1s;
    flex: 0 0 auto;
  }
  .item .expand-btn:hover {
    color: var(--ink);
    background: var(--surface-2);
  }
  .item .expand-btn::before {
    content: "▸";
    display: inline-block;
    transition: transform 0.12s;
  }
  .item.expanded .expand-btn::before {
    transform: rotate(90deg);
  }

  /* ---- Detail (hidden until expanded) ---- */
  .item .detail {
    display: none;
    margin-top: var(--s-2);
    padding-top: var(--s-2);
    border-top: 1px solid var(--hairline);
    font-size: 12px;
    line-height: 1.5;
  }
  .item.expanded .detail { display: block; }
  .item .detail .meta-row {
    display: flex;
    gap: var(--s-3);
    flex-wrap: wrap;
    color: var(--ink-subtle);
    font-variant-numeric: tabular-nums;
    margin-bottom: var(--s-2);
  }
  .item .detail .meta-row code {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-size: 11px;
    background: var(--surface-2);
    padding: 1px 6px;
    border-radius: var(--r-sm);
    color: var(--ink-muted);
  }
  .item .detail .quote {
    color: var(--ink-muted);
    font-style: italic;
    border-left: 2px solid var(--hairline);
    padding-left: var(--s-2);
  }

  .empty-msg {
    color: var(--ink-tertiary);
    font-size: 12px;
    padding: var(--s-3);
    text-align: center;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script>
"use strict";

// ====== Streamlit bridge ======
const RENDER_EVT = "streamlit:render";
const READY_EVT = "streamlit:componentReady";
const SET_VALUE_EVT = "streamlit:setComponentValue";
const SET_HEIGHT_EVT = "streamlit:setFrameHeight";

function send(type, payload = {}) {
  window.parent.postMessage(
    Object.assign({ isStreamlitMessage: true, type }, payload), "*"
  );
}
function setReady() { send(READY_EVT, { apiVersion: 1 }); }
function setValue(v) { send(SET_VALUE_EVT, { value: v, dataType: "json" }); }
function setHeight(h) {
  send(SET_HEIGHT_EVT, { height: h ?? document.documentElement.scrollHeight });
}

function escapeHtml(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"]/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;",
  })[c]);
}

let sortableInstances = [];
let lastEmittedFingerprint = null;
let lastRenderedFingerprint = null;
const expandedIds = new Set();  // persisted across rerenders

function readDomState() {
  const lists = document.querySelectorAll(".items");
  return Array.from(lists).map((list) =>
    Array.from(list.querySelectorAll(".item")).map((el) => el.dataset.id)
  );
}

function fingerprint(state) { return JSON.stringify(state); }

function emitState() {
  const state = readDomState();
  const fp = fingerprint(state);
  if (fp !== lastEmittedFingerprint) {
    lastEmittedFingerprint = fp;
    lastRenderedFingerprint = fp;
    setValue(state);
  }
}

// ====== Card rendering ======
function makeItem(item, layout) {
  const el = document.createElement("div");
  el.className = "item " + layout;
  el.dataset.id = item.id;
  if (item.role_key) el.dataset.role = item.role_key;
  if (expandedIds.has(item.id)) el.classList.add("expanded");

  const roleEmoji = (item.role || "").trim().split(" ")[0] || "•";
  const name = escapeHtml(item.name || "?");
  const secs = item.secs != null ? `~${escapeHtml(item.secs)}s` : "";
  const cueRange = escapeHtml(item.cue_range || "");
  const srtRange = escapeHtml(item.srt_range || "");
  const quoteRaw = item.quote || "";
  const quote = escapeHtml(quoteRaw.slice(0, 200))
              + (quoteRaw.length > 200 ? "…" : "");

  el.innerHTML = `
    <div class="summary">
      <span class="role-dot" title="${escapeHtml(item.role || "")}">${escapeHtml(roleEmoji)}</span>
      <span class="idx">#?</span>
      <span class="name" title="${name}">${name}</span>
      <span class="secs">${secs}</span>
      <button class="expand-btn" type="button" aria-label="展開細節"></button>
    </div>
    <div class="detail">
      <div class="meta-row">
        ${cueRange ? `<span>cues <code>${cueRange}</code></span>` : ""}
        ${srtRange ? `<span>SRT <code>${srtRange}</code></span>` : ""}
      </div>
      ${quote ? `<div class="quote">「${quote}」</div>` : ""}
    </div>
  `;

  const btn = el.querySelector(".expand-btn");
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    e.preventDefault();
    el.classList.toggle("expanded");
    if (el.classList.contains("expanded")) expandedIds.add(item.id);
    else expandedIds.delete(item.id);
    setHeight();
  });
  // Stop drag from starting on the button.
  btn.addEventListener("pointerdown", (e) => e.stopPropagation());
  btn.addEventListener("mousedown", (e) => e.stopPropagation());

  return el;
}

function makeContainer(c, layout, isAssembly) {
  const div = document.createElement("div");
  div.className = "container" + (isAssembly ? " assembly" : "");

  const header = document.createElement("div");
  header.className = "header";
  const titleSpan = document.createElement("span");
  titleSpan.className = "title";
  titleSpan.innerHTML = c.header || "";
  header.appendChild(titleSpan);
  if (c.meta) {
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.innerHTML = c.meta;
    header.appendChild(meta);
  }
  div.appendChild(header);

  const itemsDiv = document.createElement("div");
  itemsDiv.className = "items " + layout;
  if (c.role) itemsDiv.dataset.role = c.role;
  if (!c.items || c.items.length === 0) {
    itemsDiv.classList.add("empty");
    const empty = document.createElement("div");
    empty.className = "empty-msg";
    empty.textContent = c.empty_msg || "(空)";
    itemsDiv.appendChild(empty);
  } else {
    c.items.forEach((item) => itemsDiv.appendChild(makeItem(item, layout)));
  }
  div.appendChild(itemsDiv);
  return { wrapper: div, list: itemsDiv };
}

function destroyAllSortables() {
  sortableInstances.forEach((s) => { try { s.destroy(); } catch (e) {} });
  sortableInstances = [];
}

function updateAssemblyIndices() {
  document.querySelectorAll(".item .idx").forEach((b) => {
    b.style.display = "none";
  });
  const assemblyList = document.querySelector(".container.assembly .items");
  if (!assemblyList) return;
  Array.from(assemblyList.querySelectorAll(".item")).forEach((el, i) => {
    const badge = el.querySelector(".idx");
    if (badge) {
      badge.style.display = "inline-flex";
      badge.textContent = `${i + 1}`;
    }
  });
}

function fixEmptyState(list) {
  const items = list.querySelectorAll(".item");
  const msg = list.querySelector(".empty-msg");
  if (items.length === 0) {
    list.classList.add("empty");
    if (!msg) {
      const empty = document.createElement("div");
      empty.className = "empty-msg";
      empty.textContent = "(空)";
      list.appendChild(empty);
    }
  } else {
    list.classList.remove("empty");
    if (msg) msg.remove();
  }
}

function setupSortables() {
  destroyAllSortables();
  document.querySelectorAll(".items").forEach((list) => {
    sortableInstances.push(new Sortable(list, {
      group: "blocks",
      animation: 160,
      ghostClass: "ghost",
      dragClass: "drag",
      draggable: ".item",
      filter: ".empty-msg, .expand-btn",
      preventOnFilter: false,
      forceFallback: true,
      fallbackOnBody: true,
      onEnd: (evt) => {
        if (evt.from) fixEmptyState(evt.from);
        if (evt.to && evt.to !== evt.from) fixEmptyState(evt.to);
        updateAssemblyIndices();
        emitState();
      },
    }));
  });

  const catcher = document.getElementById("catcher");
  if (catcher) {
    sortableInstances.push(new Sortable(catcher, {
      group: { name: "blocks", pull: false, put: true },
      animation: 160,
      ghostClass: "ghost",
      draggable: ".item",
      forceFallback: true,
      fallbackOnBody: true,
      onAdd: (evt) => {
        const item = evt.item;
        const role = item.dataset.role;
        let target = role
          ? document.querySelector(`.items[data-role="${role}"]`)
          : null;
        if (!target) target = document.querySelector(".row .items");
        if (target) {
          target.appendChild(item);
          fixEmptyState(target);
        }
        catcher.querySelectorAll(".item").forEach((el) => el.remove());
        updateAssemblyIndices();
        emitState();
      },
    }));
  }
}

function renderUI(args) {
  const containers = args.containers || [];
  const root = document.getElementById("root");
  root.innerHTML = "";

  const catcher = document.createElement("div");
  catcher.id = "catcher";
  catcher.textContent = "拖到這裡 → 自動歸位到對應分類";
  root.appendChild(catcher);

  let rowDiv = null;
  containers.forEach((c, idx) => {
    const isAssembly = idx === 0;
    const layout = "horizontal";
    const { wrapper } = makeContainer(c, layout, isAssembly);
    if (isAssembly) {
      root.appendChild(wrapper);
    } else {
      if (!rowDiv) {
        rowDiv = document.createElement("div");
        rowDiv.className = "row";
        root.appendChild(rowDiv);
      }
      rowDiv.appendChild(wrapper);
    }
  });

  setupSortables();
  updateAssemblyIndices();
}

function onStreamlitRender(args) {
  const incoming = (args.containers || []).map((c) =>
    (c.items || []).map((i) => i.id)
  );
  const incomingFp = fingerprint(incoming);

  if (incomingFp === lastEmittedFingerprint && lastRenderedFingerprint) {
    setHeight();
    return;
  }
  renderUI(args);
  lastRenderedFingerprint = incomingFp;
  lastEmittedFingerprint = incomingFp;
  setHeight();
}

window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== RENDER_EVT) return;
  onStreamlitRender(event.data.args || {});
});

setReady();
setHeight(400);
</script>
</body>
</html>
