<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<title>block-sorter</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
                 "PingFang TC", "Microsoft JhengHei", sans-serif;
    padding: 8px 4px;
    color: #1f1f1f;
    background: transparent;
  }
  .container {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 14px;
    background: #fafafa;
  }
  .container.assembly {
    background: #fff8e1;
    border-color: #ffb300;
    border-width: 2px;
  }
  .header {
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header .meta { font-weight: 400; color: #666; font-size: 12px; }
  .items {
    min-height: 50px;
    border: 2px dashed transparent;
    border-radius: 6px;
    padding: 4px;
    transition: border-color 0.1s;
  }
  .items.empty { border-color: #ddd; }
  .items.horizontal {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .items.vertical {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .item {
    padding: 8px 10px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: grab;
    font-size: 13px;
    line-height: 1.4;
    user-select: none;
    transition: box-shadow 0.1s, transform 0.1s;
    width: 180px;
    flex: 0 0 180px;
    min-height: 60px;
  }
  .item:hover {
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    border-color: #888;
  }
  .item:active { cursor: grabbing; }
  /* uniform card size whether in assembly or categories */
  .item.horizontal,
  .item.vertical { width: 180px; flex: 0 0 180px; }
  .item .role {
    display: inline-block;
    font-size: 10px;
    color: #888;
    background: #eee;
    padding: 1px 6px;
    border-radius: 3px;
    margin-right: 6px;
  }
  .item .idx {
    display: inline-block;
    background: #ff8f00;
    color: white;
    padding: 1px 8px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 11px;
    margin-right: 6px;
  }
  .item .name { font-weight: 600; }
  .item .quote {
    color: #555; font-size: 11px; margin-top: 3px; font-style: italic;
  }
  .item .secs { font-size: 11px; color: #999; float: right; }
  .item .cues {
    color: #777;
    font-size: 11px;
    margin-top: 3px;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  .ghost { opacity: 0.4; background: #fffde7; }
  .drag {
    cursor: grabbing !important;
    box-shadow: 0 6px 14px rgba(0,0,0,0.18);
  }
  .row {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    gap: 10px;
    margin-bottom: 14px;
    overflow-x: auto;
    overflow-y: visible;
    padding-bottom: 8px;
  }
  .row .container {
    margin-bottom: 0;
    flex: 0 0 240px;
    min-width: 240px;
    max-width: 240px;
  }
  .row .container .header { font-size: 13px; }
  .row .items.horizontal {
    /* Inside a fixed-width column, items stack vertically so the
       column itself doesn't have to grow horizontally. */
    flex-direction: column;
    flex-wrap: nowrap;
  }
  .row .item.horizontal { width: 100%; flex: 0 0 auto; }
  .empty-msg {
    color: #999;
    font-size: 12px;
    padding: 8px;
    text-align: center;
  }
  #catcher {
    border: 2px dashed #ccc;
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    color: #888;
    margin-bottom: 14px;
    background: #fafafa;
    position: sticky;
    top: 0;
    z-index: 10;
    transition: background 0.1s, border-color 0.1s, color 0.1s;
  }
  #catcher.hot {
    background: #fff3e0;
    border-color: #ff9800;
    color: #e65100;
  }
  #catcher .item { display: none; }  /* never keep items inside */
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script>
"use strict";

// ====== Streamlit bridge ======
const RENDER_EVT = "streamlit:render";
const READY_EVT = "streamlit:componentReady";
const SET_VALUE_EVT = "streamlit:setComponentValue";
const SET_HEIGHT_EVT = "streamlit:setFrameHeight";

function send(type, payload = {}) {
  window.parent.postMessage(
    Object.assign({ isStreamlitMessage: true, type }, payload), "*"
  );
}
function setReady() { send(READY_EVT, { apiVersion: 1 }); }
function setValue(v) { send(SET_VALUE_EVT, { value: v, dataType: "json" }); }
function setHeight(h) {
  send(SET_HEIGHT_EVT, { height: h ?? document.documentElement.scrollHeight });
}

function escapeHtml(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"]/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;",
  })[c]);
}

// ====== State (persisted across renders) ======
let sortableInstances = [];
let lastEmittedFingerprint = null;   // what we last reported to Streamlit
let lastRenderedFingerprint = null;  // what's currently in the DOM

function readDomState() {
  const lists = document.querySelectorAll(".items");
  return Array.from(lists).map((list) =>
    Array.from(list.querySelectorAll(".item")).map((el) => el.dataset.id)
  );
}

function fingerprint(state) {
  return JSON.stringify(state);
}

function emitState() {
  const state = readDomState();
  const fp = fingerprint(state);
  // Only emit if state actually changed since last emit/render
  if (fp !== lastEmittedFingerprint) {
    lastEmittedFingerprint = fp;
    lastRenderedFingerprint = fp;
    setValue(state);
  }
}

// ====== Rendering ======
function makeItem(item, layout) {
  const el = document.createElement("div");
  el.className = "item " + layout;
  el.dataset.id = item.id;
  if (item.role_key) el.dataset.role = item.role_key;  // for auto-route
  if (item.html) {
    el.innerHTML = item.html;
  } else {
    const idxBadge = `<span class="idx" style="display:none">#?</span>`;
    const role = item.role
      ? `<span class="role">${escapeHtml(item.role)}</span>` : "";
    const secs = item.secs != null
      ? `<span class="secs">~${escapeHtml(item.secs)}s</span>` : "";
    const name = `<span class="name">${escapeHtml(item.name || "?")}</span>`;
    const cues = item.cue_range
      ? `<div class="cues">cues <b>${escapeHtml(item.cue_range)}</b>`
        + (item.srt_range ? ` · ${escapeHtml(item.srt_range)}` : "")
        + `</div>`
      : "";
    const quote = item.quote
      ? `<div class="quote">「${escapeHtml(item.quote.slice(0, 80))}${item.quote.length > 80 ? "…" : ""}」</div>`
      : "";
    el.innerHTML = `<div>${idxBadge}${role}${name}${secs}</div>${cues}${quote}`;
  }
  return el;
}

function makeContainer(c, layout, isAssembly) {
  const div = document.createElement("div");
  div.className = "container" + (isAssembly ? " assembly" : "");

  const header = document.createElement("div");
  header.className = "header";
  const titleSpan = document.createElement("span");
  titleSpan.innerHTML = c.header || "";
  header.appendChild(titleSpan);
  if (c.meta) {
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.innerHTML = c.meta;
    header.appendChild(meta);
  }
  div.appendChild(header);

  const itemsDiv = document.createElement("div");
  itemsDiv.className = "items " + layout;
  if (c.role) itemsDiv.dataset.role = c.role;  // for auto-route
  if (!c.items || c.items.length === 0) {
    itemsDiv.classList.add("empty");
    const empty = document.createElement("div");
    empty.className = "empty-msg";
    empty.textContent = c.empty_msg || "(空)";
    itemsDiv.appendChild(empty);
  } else {
    c.items.forEach((item) => itemsDiv.appendChild(makeItem(item, layout)));
  }
  div.appendChild(itemsDiv);
  return { wrapper: div, list: itemsDiv };
}

function destroyAllSortables() {
  sortableInstances.forEach((s) => {
    try { s.destroy(); } catch (e) {}
  });
  sortableInstances = [];
}

function updateAssemblyIndices() {
  // Hide all idx badges first (cards in pool shouldn't show index)
  document.querySelectorAll(".item .idx").forEach((b) => {
    b.style.display = "none";
  });
  // Then number cards in the assembly container 1, 2, 3, ...
  const assemblyList = document.querySelector(".container.assembly .items");
  if (!assemblyList) return;
  Array.from(assemblyList.querySelectorAll(".item")).forEach((el, i) => {
    const badge = el.querySelector(".idx");
    if (badge) {
      badge.style.display = "inline-block";
      badge.textContent = `#${i + 1}`;
    }
  });
}

function fixEmptyState(list) {
  const items = list.querySelectorAll(".item");
  const msg = list.querySelector(".empty-msg");
  if (items.length === 0) {
    list.classList.add("empty");
    if (!msg) {
      const empty = document.createElement("div");
      empty.className = "empty-msg";
      empty.textContent = "(空)";
      list.appendChild(empty);
    }
  } else {
    list.classList.remove("empty");
    if (msg) msg.remove();
  }
}

function fixLayoutClass(item, container) {
  // Container's items list has class 'horizontal' or 'vertical'
  const isHor = container.classList.contains("horizontal");
  item.classList.remove("horizontal", "vertical");
  item.classList.add(isHor ? "horizontal" : "vertical");
}

function setupSortables() {
  destroyAllSortables();
  document.querySelectorAll(".items").forEach((list) => {
    sortableInstances.push(new Sortable(list, {
      group: "blocks",
      animation: 150,
      ghostClass: "ghost",
      dragClass: "drag",
      // Only .item elements are draggable; the (空) placeholder is not.
      // This fixes a first-drag-snaps-back bug where the placeholder
      // got picked up as a drag source.
      draggable: ".item",
      filter: ".empty-msg",
      // forceFallback gives consistent behavior inside Streamlit iframes
      // (native HTML5 drag occasionally drops the first event).
      forceFallback: true,
      fallbackOnBody: true,
      onEnd: (evt) => {
        if (evt.from) fixEmptyState(evt.from);
        if (evt.to && evt.to !== evt.from) {
          fixEmptyState(evt.to);
          fixLayoutClass(evt.item, evt.to);
        }
        updateAssemblyIndices();
        emitState();
      },
    }));
  });

  // Catcher: drop here = auto-route to item's narrative_role category
  const catcher = document.getElementById("catcher");
  if (catcher) {
    sortableInstances.push(new Sortable(catcher, {
      group: { name: "blocks", pull: false, put: true },
      animation: 150,
      ghostClass: "ghost",
      draggable: ".item",
      forceFallback: true,
      fallbackOnBody: true,
      onAdd: (evt) => {
        const item = evt.item;
        const role = item.dataset.role;
        let target = role
          ? document.querySelector(`.items[data-role="${role}"]`)
          : null;
        if (!target) {
          // No matching category — fallback to first category container
          target = document.querySelector(".row .items");
        }
        if (target) {
          target.appendChild(item);
          fixLayoutClass(item, target);
          fixEmptyState(target);
        }
        // Catcher should never retain items; remove placeholder if any
        catcher.querySelectorAll(".item").forEach((el) => el.remove());
        updateAssemblyIndices();
        emitState();
      },
    }));
  }
}

function renderUI(args) {
  const containers = args.containers || [];
  const root = document.getElementById("root");
  root.innerHTML = "";

  // Auto-route catcher at the TOP — placed before the assembly so it's
  // always reachable even when category columns get tall.
  const catcher = document.createElement("div");
  catcher.id = "catcher";
  catcher.textContent = "🪄 把片段拖到這裡 → 自動歸位到該類別";
  root.appendChild(catcher);

  let rowDiv = null;
  containers.forEach((c, idx) => {
    const isAssembly = idx === 0;
    // Use 'horizontal' wrap layout for ALL containers — uniform card size,
    // assembly is just visually distinguished by the orange border.
    const layout = "horizontal";
    const { wrapper } = makeContainer(c, layout, isAssembly);
    if (isAssembly) {
      root.appendChild(wrapper);
    } else {
      if (!rowDiv) {
        rowDiv = document.createElement("div");
        rowDiv.className = "row";
        root.appendChild(rowDiv);
      }
      rowDiv.appendChild(wrapper);
    }
  });

  setupSortables();
  updateAssemblyIndices();
}

// ====== Streamlit render handler ======
function onStreamlitRender(args) {
  const incoming = (args.containers || []).map((c) =>
    (c.items || []).map((i) => i.id)
  );
  const incomingFp = fingerprint(incoming);

  // If incoming state matches what we just emitted, skip rebuild —
  // this prevents flicker after user drag (Python re-renders with the
  // exact state we just reported, no need to disturb the DOM).
  if (incomingFp === lastEmittedFingerprint && lastRenderedFingerprint) {
    setHeight();
    return;
  }

  // Otherwise, args genuinely changed (regenerate, new theme, etc.):
  // do a full rebuild.
  renderUI(args);
  lastRenderedFingerprint = incomingFp;
  lastEmittedFingerprint = incomingFp;
  // No need to setValue here: Python already has this state.
  setHeight();
}

window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== RENDER_EVT) return;
  onStreamlitRender(event.data.args || {});
});

setReady();
setHeight(400);
</script>
</body>
</html>
