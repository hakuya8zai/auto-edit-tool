<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<title>block-sorter</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
                 "PingFang TC", "Microsoft JhengHei", sans-serif;
    padding: 8px 4px;
    color: #1f1f1f;
    background: transparent;
  }
  .container {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 14px;
    background: #fafafa;
  }
  .container.assembly {
    background: #fff8e1;
    border-color: #ffb300;
    border-width: 2px;
  }
  .header {
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header .meta { font-weight: 400; color: #666; font-size: 12px; }
  .items {
    min-height: 50px;
    border: 2px dashed transparent;
    border-radius: 6px;
    padding: 4px;
    transition: border-color 0.1s;
  }
  .items.empty { border-color: #ddd; }
  .items.horizontal {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .items.vertical {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .item {
    padding: 8px 10px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: grab;
    font-size: 13px;
    line-height: 1.4;
    user-select: none;
    transition: box-shadow 0.1s, transform 0.1s;
  }
  .item:hover {
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    border-color: #888;
  }
  .item:active { cursor: grabbing; }
  .item.horizontal { width: 200px; flex-shrink: 0; }
  .item .role {
    display: inline-block;
    font-size: 10px;
    color: #888;
    background: #eee;
    padding: 1px 6px;
    border-radius: 3px;
    margin-right: 6px;
  }
  .item .name { font-weight: 600; }
  .item .quote { color: #555; font-size: 11px; margin-top: 3px; font-style: italic; }
  .item .secs { font-size: 11px; color: #999; float: right; }
  .ghost { opacity: 0.4; background: #fffde7; }
  .drag {
    cursor: grabbing !important;
    box-shadow: 0 6px 14px rgba(0,0,0,0.18);
  }
  .row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }
  .row .container { margin-bottom: 0; }
  .row .container .header { font-size: 13px; }
  .empty-msg {
    color: #999;
    font-size: 12px;
    padding: 8px;
    text-align: center;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script>
"use strict";

// ====== Streamlit bridge ======
const RENDER_EVT = "streamlit:render";
const READY_EVT = "streamlit:componentReady";
const SET_VALUE_EVT = "streamlit:setComponentValue";
const SET_HEIGHT_EVT = "streamlit:setFrameHeight";

function send(type, payload = {}) {
  window.parent.postMessage(
    Object.assign({ isStreamlitMessage: true, type }, payload), "*"
  );
}
function setReady() { send(READY_EVT, { apiVersion: 1 }); }
function setValue(v) { send(SET_VALUE_EVT, { value: v, dataType: "json" }); }
function setHeight(h) {
  send(SET_HEIGHT_EVT, { height: h ?? document.documentElement.scrollHeight });
}

function escapeHtml(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"]/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;",
  })[c]);
}

// ====== State (persisted across renders) ======
let sortableInstances = [];
let lastEmittedFingerprint = null;   // what we last reported to Streamlit
let lastRenderedFingerprint = null;  // what's currently in the DOM

function readDomState() {
  const lists = document.querySelectorAll(".items");
  return Array.from(lists).map((list) =>
    Array.from(list.querySelectorAll(".item")).map((el) => el.dataset.id)
  );
}

function fingerprint(state) {
  return JSON.stringify(state);
}

function emitState() {
  const state = readDomState();
  const fp = fingerprint(state);
  // Only emit if state actually changed since last emit/render
  if (fp !== lastEmittedFingerprint) {
    lastEmittedFingerprint = fp;
    lastRenderedFingerprint = fp;
    setValue(state);
  }
}

// ====== Rendering ======
function makeItem(item, layout) {
  const el = document.createElement("div");
  el.className = "item " + layout;
  el.dataset.id = item.id;
  if (item.html) {
    el.innerHTML = item.html;
  } else {
    const role = item.role
      ? `<span class="role">${escapeHtml(item.role)}</span>` : "";
    const secs = item.secs != null
      ? `<span class="secs">~${escapeHtml(item.secs)}s</span>` : "";
    const name = `<span class="name">${escapeHtml(item.name || "?")}</span>`;
    const quote = item.quote
      ? `<div class="quote">「${escapeHtml(item.quote.slice(0, 36))}」</div>` : "";
    el.innerHTML = `<div>${role}${name}${secs}</div>${quote}`;
  }
  return el;
}

function makeContainer(c, layout, isAssembly) {
  const div = document.createElement("div");
  div.className = "container" + (isAssembly ? " assembly" : "");

  const header = document.createElement("div");
  header.className = "header";
  const titleSpan = document.createElement("span");
  titleSpan.innerHTML = c.header || "";
  header.appendChild(titleSpan);
  if (c.meta) {
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.innerHTML = c.meta;
    header.appendChild(meta);
  }
  div.appendChild(header);

  const itemsDiv = document.createElement("div");
  itemsDiv.className = "items " + layout;
  if (!c.items || c.items.length === 0) {
    itemsDiv.classList.add("empty");
    const empty = document.createElement("div");
    empty.className = "empty-msg";
    empty.textContent = c.empty_msg || "(空)";
    itemsDiv.appendChild(empty);
  } else {
    c.items.forEach((item) => itemsDiv.appendChild(makeItem(item, layout)));
  }
  div.appendChild(itemsDiv);
  return { wrapper: div, list: itemsDiv };
}

function destroyAllSortables() {
  sortableInstances.forEach((s) => {
    try { s.destroy(); } catch (e) {}
  });
  sortableInstances = [];
}

function fixEmptyState(list) {
  const items = list.querySelectorAll(".item");
  const msg = list.querySelector(".empty-msg");
  if (items.length === 0) {
    list.classList.add("empty");
    if (!msg) {
      const empty = document.createElement("div");
      empty.className = "empty-msg";
      empty.textContent = "(空)";
      list.appendChild(empty);
    }
  } else {
    list.classList.remove("empty");
    if (msg) msg.remove();
  }
}

function setupSortables() {
  destroyAllSortables();
  document.querySelectorAll(".items").forEach((list) => {
    sortableInstances.push(new Sortable(list, {
      group: "blocks",
      animation: 150,
      ghostClass: "ghost",
      dragClass: "drag",
      forceFallback: true,
      fallbackOnBody: true,
      swapThreshold: 0.6,
      onEnd: (evt) => {
        // Update empty state markers on both source & destination lists
        if (evt.from) fixEmptyState(evt.from);
        if (evt.to && evt.to !== evt.from) fixEmptyState(evt.to);
        emitState();
      },
    }));
  });
}

function renderUI(args) {
  const containers = args.containers || [];
  const root = document.getElementById("root");
  root.innerHTML = "";

  let rowDiv = null;
  containers.forEach((c, idx) => {
    const isAssembly = idx === 0;
    const layout = isAssembly ? "horizontal" : "vertical";
    const { wrapper } = makeContainer(c, layout, isAssembly);
    if (isAssembly) {
      root.appendChild(wrapper);
    } else {
      if (!rowDiv) {
        rowDiv = document.createElement("div");
        rowDiv.className = "row";
        root.appendChild(rowDiv);
      }
      rowDiv.appendChild(wrapper);
    }
  });

  setupSortables();
}

// ====== Streamlit render handler ======
function onStreamlitRender(args) {
  const incoming = (args.containers || []).map((c) =>
    (c.items || []).map((i) => i.id)
  );
  const incomingFp = fingerprint(incoming);

  // If incoming state matches what we just emitted, skip rebuild —
  // this prevents flicker after user drag (Python re-renders with the
  // exact state we just reported, no need to disturb the DOM).
  if (incomingFp === lastEmittedFingerprint && lastRenderedFingerprint) {
    setHeight();
    return;
  }

  // Otherwise, args genuinely changed (regenerate, new theme, etc.):
  // do a full rebuild.
  renderUI(args);
  lastRenderedFingerprint = incomingFp;
  lastEmittedFingerprint = incomingFp;
  // No need to setValue here: Python already has this state.
  setHeight();
}

window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== RENDER_EVT) return;
  onStreamlitRender(event.data.args || {});
});

setReady();
setHeight(400);
</script>
</body>
</html>
