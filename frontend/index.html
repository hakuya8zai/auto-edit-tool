<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<title>block-sorter</title>
<style>
  :root {
    --canvas:        #f9f9fb;
    --surface-1:     #ffffff;
    --surface-2:     #f4f4f6;
    --surface-3:     #edeef1;
    --hairline:      #e3e4e8;
    --hairline-strong:#cdced3;

    --ink:           #1f2024;
    --ink-muted:     #4a4c54;
    --ink-subtle:    #8a8f98;
    --ink-tertiary:  #b1b5bd;

    --accent:        #5e6ad2;
    --accent-hover:  #828fff;
    --accent-soft:   #eef0fb;

    --r-sm: 6px;
    --r-md: 8px;
    --r-lg: 10px;
    --r-pill: 9999px;

    --s-1: 4px;
    --s-2: 8px;
    --s-3: 12px;
    --s-4: 16px;
    --s-5: 24px;

    --shadow-1: 0 1px 2px rgba(15, 16, 17, 0.04), 0 0 0 1px rgba(15, 16, 17, 0.02);
    --shadow-2: 0 4px 14px rgba(15, 16, 17, 0.10), 0 0 0 1px rgba(15, 16, 17, 0.04);

    --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI",
            "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
    background: transparent;
    padding: 4px 0 12px;
    letter-spacing: -0.005em;
  }

  /* ---- Containers ---- */
  .container {
    background: var(--surface-1);
    border: 1px solid var(--hairline);
    border-radius: var(--r-lg);
    padding: var(--s-3);
    margin-bottom: var(--s-3);
  }
  .container.assembly {
    border: 1px solid var(--accent);
    background:
      linear-gradient(180deg, rgba(94,106,210,0.05), transparent 60px),
      var(--surface-1);
  }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: var(--s-3);
    padding: 0 var(--s-1);
  }
  .header .title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .header .meta {
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-subtle);
    font-variant-numeric: tabular-nums;
  }

  .items {
    min-height: 48px;
    border-radius: var(--r-md);
    padding: var(--s-1);
  }
  .items.empty { background: var(--surface-2); }
  .items.horizontal,
  .items.vertical { display: flex; flex-direction: column; gap: var(--s-2); }

  /* Category row — horizontal scroll, fixed-width columns */
  .row {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    gap: var(--s-3);
    margin-bottom: var(--s-4);
    overflow-x: auto;
    overflow-y: visible;
    padding-bottom: var(--s-2);
    scrollbar-width: thin;
  }
  .row::-webkit-scrollbar { height: 8px; }
  .row::-webkit-scrollbar-thumb {
    background: var(--hairline-strong);
    border-radius: var(--r-pill);
  }
  .row .container {
    margin-bottom: 0;
    flex: 0 0 240px;
    min-width: 240px;
    max-width: 240px;
  }

  /* ---- Card ---- */
  .item {
    position: relative;
    background: var(--surface-1);
    border: 1px solid var(--hairline);
    border-radius: var(--r-md);
    padding: var(--s-2) var(--s-3) var(--s-3);
    cursor: grab;
    user-select: none;
    transition: border-color 0.1s, box-shadow 0.1s, transform 0.1s;
    box-shadow: var(--shadow-1);
  }
  .item:hover {
    border-color: var(--hairline-strong);
    box-shadow: var(--shadow-2);
  }
  .item:active { cursor: grabbing; }
  .item.ghost {
    opacity: 0.35;
    background: var(--accent-soft);
    border-style: dashed;
  }
  .item.drag {
    cursor: grabbing;
    box-shadow: 0 14px 36px rgba(15, 16, 17, 0.22);
    transform: rotate(0.6deg);
  }

  /* Row 1: role pill + index badge + duration */
  .item .row1 {
    display: flex;
    align-items: center;
    gap: var(--s-2);
    margin-bottom: 6px;
  }
  .item .role {
    font-size: 10px;
    font-weight: 500;
    color: var(--ink-muted);
    background: var(--surface-2);
    padding: 2px 8px;
    border-radius: var(--r-pill);
    letter-spacing: 0.02em;
    white-space: nowrap;
    flex: 0 0 auto;
  }
  .item .idx {
    display: none;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    padding: 2px 7px;
    border-radius: var(--r-pill);
    font-variant-numeric: tabular-nums;
    flex: 0 0 auto;
  }
  .container.assembly .item .idx { display: inline-flex; }
  .item .spacer { flex: 1 1 auto; }
  .item .secs {
    font-size: 11px;
    color: var(--ink-subtle);
    font-variant-numeric: tabular-nums;
    flex: 0 0 auto;
  }

  /* Row 2: name (semibold, can wrap to 2 lines) */
  .item .name {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: -0.01em;
    line-height: 1.35;
    margin-bottom: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }

  /* Row 3: SRT preview text — 2 lines max */
  .item .quote {
    font-size: 11.5px;
    color: var(--ink-muted);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }
  .item .quote::before { content: "「"; color: var(--ink-tertiary); }
  .item .quote::after  { content: "」"; color: var(--ink-tertiary); }

  /* Row 4: meta (cue range + SRT time) — small, monospace */
  .item .meta-line {
    margin-top: 6px;
    font-size: 10.5px;
    color: var(--ink-tertiary);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
    display: flex;
    gap: var(--s-2);
    flex-wrap: wrap;
  }

  .empty-msg {
    color: var(--ink-tertiary);
    font-size: 12px;
    padding: var(--s-3);
    text-align: center;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script>
"use strict";

const RENDER_EVT = "streamlit:render";
const READY_EVT = "streamlit:componentReady";
const SET_VALUE_EVT = "streamlit:setComponentValue";
const SET_HEIGHT_EVT = "streamlit:setFrameHeight";

function send(type, payload = {}) {
  window.parent.postMessage(
    Object.assign({ isStreamlitMessage: true, type }, payload), "*"
  );
}
function setReady() { send(READY_EVT, { apiVersion: 1 }); }
function setValue(v) { send(SET_VALUE_EVT, { value: v, dataType: "json" }); }
function setHeight(h) {
  send(SET_HEIGHT_EVT, { height: h ?? document.documentElement.scrollHeight });
}

function escapeHtml(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"]/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;",
  })[c]);
}

let sortableInstances = [];
let lastEmittedFingerprint = null;
let lastRenderedFingerprint = null;

function readDomState() {
  const lists = document.querySelectorAll(".items");
  return Array.from(lists).map((list) =>
    Array.from(list.querySelectorAll(".item")).map((el) => el.dataset.id)
  );
}

function fingerprint(state) { return JSON.stringify(state); }

function emitState() {
  const state = readDomState();
  const fp = fingerprint(state);
  if (fp !== lastEmittedFingerprint) {
    lastEmittedFingerprint = fp;
    lastRenderedFingerprint = fp;
    setValue(state);
  }
}

function makeItem(item, layout) {
  const el = document.createElement("div");
  el.className = "item " + layout;
  el.dataset.id = item.id;
  if (item.role_key) el.dataset.role = item.role_key;

  const roleLabel = escapeHtml((item.role || "").trim());
  const name = escapeHtml(item.name || "?");
  const secs = item.secs != null ? `~${escapeHtml(item.secs)}s` : "";
  const cueRange = escapeHtml(item.cue_range || "");
  const srtRange = escapeHtml(item.srt_range || "");
  const quoteRaw = item.quote || "";
  const quote = escapeHtml(quoteRaw.slice(0, 120))
              + (quoteRaw.length > 120 ? "…" : "");

  el.innerHTML = `
    <div class="row1">
      <span class="idx">#?</span>
      ${roleLabel ? `<span class="role">${roleLabel}</span>` : ""}
      <span class="spacer"></span>
      ${secs ? `<span class="secs">${secs}</span>` : ""}
    </div>
    <div class="name">${name}</div>
    ${quote ? `<div class="quote">${quote}</div>` : ""}
    ${(cueRange || srtRange) ? `
      <div class="meta-line">
        ${cueRange ? `<span>cues ${cueRange}</span>` : ""}
        ${srtRange ? `<span>${srtRange}</span>` : ""}
      </div>
    ` : ""}
  `;
  return el;
}

function makeContainer(c, layout, isAssembly) {
  const div = document.createElement("div");
  div.className = "container" + (isAssembly ? " assembly" : "");

  const header = document.createElement("div");
  header.className = "header";
  const titleSpan = document.createElement("span");
  titleSpan.className = "title";
  titleSpan.innerHTML = c.header || "";
  header.appendChild(titleSpan);
  if (c.meta) {
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.innerHTML = c.meta;
    header.appendChild(meta);
  }
  div.appendChild(header);

  const itemsDiv = document.createElement("div");
  itemsDiv.className = "items " + layout;
  if (c.role) itemsDiv.dataset.role = c.role;
  if (!c.items || c.items.length === 0) {
    itemsDiv.classList.add("empty");
    const empty = document.createElement("div");
    empty.className = "empty-msg";
    empty.textContent = c.empty_msg || "(空)";
    itemsDiv.appendChild(empty);
  } else {
    c.items.forEach((item) => itemsDiv.appendChild(makeItem(item, layout)));
  }
  div.appendChild(itemsDiv);
  return { wrapper: div, list: itemsDiv };
}

function destroyAllSortables() {
  sortableInstances.forEach((s) => { try { s.destroy(); } catch (e) {} });
  sortableInstances = [];
}

function updateAssemblyIndices() {
  document.querySelectorAll(".item .idx").forEach((b) => {
    b.style.display = "none";
  });
  const assemblyList = document.querySelector(".container.assembly .items");
  if (!assemblyList) return;
  Array.from(assemblyList.querySelectorAll(".item")).forEach((el, i) => {
    const badge = el.querySelector(".idx");
    if (badge) {
      badge.style.display = "inline-flex";
      badge.textContent = `${i + 1}`;
    }
  });
}

function fixEmptyState(list) {
  const items = list.querySelectorAll(".item");
  const msg = list.querySelector(".empty-msg");
  if (items.length === 0) {
    list.classList.add("empty");
    if (!msg) {
      const empty = document.createElement("div");
      empty.className = "empty-msg";
      empty.textContent = "(空)";
      list.appendChild(empty);
    }
  } else {
    list.classList.remove("empty");
    if (msg) msg.remove();
  }
}

function setupSortables() {
  destroyAllSortables();
  document.querySelectorAll(".items").forEach((list) => {
    sortableInstances.push(new Sortable(list, {
      group: "blocks",
      animation: 160,
      ghostClass: "ghost",
      dragClass: "drag",
      draggable: ".item",
      filter: ".empty-msg",
      // Use native HTML5 drag — Streamlit iframe + forceFallback has
      // proven flaky (intermittent first-drag snap-back).
      forceFallback: false,
      onEnd: (evt) => {
        if (evt.from) fixEmptyState(evt.from);
        if (evt.to && evt.to !== evt.from) fixEmptyState(evt.to);
        updateAssemblyIndices();
        emitState();
      },
    }));
  });
}

function renderUI(args) {
  const containers = args.containers || [];
  const root = document.getElementById("root");
  root.innerHTML = "";

  let rowDiv = null;
  containers.forEach((c, idx) => {
    const isAssembly = idx === 0;
    const layout = "vertical";
    const { wrapper } = makeContainer(c, layout, isAssembly);
    if (isAssembly) {
      root.appendChild(wrapper);
    } else {
      if (!rowDiv) {
        rowDiv = document.createElement("div");
        rowDiv.className = "row";
        root.appendChild(rowDiv);
      }
      rowDiv.appendChild(wrapper);
    }
  });

  setupSortables();
  updateAssemblyIndices();
}

function onStreamlitRender(args) {
  const incoming = (args.containers || []).map((c) =>
    (c.items || []).map((i) => i.id)
  );
  const incomingFp = fingerprint(incoming);

  if (incomingFp === lastEmittedFingerprint && lastRenderedFingerprint) {
    setHeight();
    return;
  }
  renderUI(args);
  lastRenderedFingerprint = incomingFp;
  lastEmittedFingerprint = incomingFp;
  setHeight();
}

window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== RENDER_EVT) return;
  onStreamlitRender(event.data.args || {});
});

setReady();
setHeight(400);
</script>
</body>
</html>
